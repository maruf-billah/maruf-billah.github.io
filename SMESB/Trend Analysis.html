<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise BI Performance Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- html2pdf for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Dropdown transition */
        .export-dropdown {
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.2s ease;
        }
        .export-menu-container:hover .export-dropdown {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        /* Tree Styles */
        .tree-children { display: none; }
        .tree-children.open { display: block; animation: slideDown 0.2s ease-out; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        .chevron { transition: transform 0.2s ease; }
        .chevron.open { transform: rotate(90deg); }
    </style>
</head>
<body class="text-slate-800 flex flex-col min-h-screen">

    <!-- Top Navigation Bar -->
    <nav class="bg-white border-b border-slate-200 px-6 py-4 sticky top-0 z-30 shadow-sm">
        <div class="max-w-[1600px] mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2 rounded-lg shadow-inner">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900 leading-tight">Enterprise Performance Analytics</h1>
                    <p class="text-xs text-slate-500 font-medium tracking-wide" id="currentDateDisplay"></p>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Workspace (Side Panel + Content) -->
    <div class="flex-1 flex flex-col lg:flex-row max-w-[1600px] w-full mx-auto p-4 gap-6">
        
        <!-- LEFT SIDEBAR: FILTERS -->
        <aside class="w-full lg:w-80 flex-shrink-0 flex flex-col gap-5">
            
            <!-- Filter Controls -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-5">
                <div>
                    <label for="metricSelect" class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">1. Data Point</label>
                    <select id="metricSelect" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm font-medium rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 p-2.5 outline-none transition-all cursor-pointer shadow-sm">
                        <option value="EMI Progress">EMI Progress</option>
                        <option value="Collectable (%)">Collectable (%)</option>
                        <option value="Collection (%)">Collection (%)</option>
                    </select>
                </div>

                <div>
                    <label for="displayLevelSelect" class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">2. Plot Level</label>
                    <select id="displayLevelSelect" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm font-medium rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 p-2.5 outline-none transition-all cursor-pointer shadow-sm">
                        <option value="zone">Zones Only</option>
                        <option value="region" selected>Regions Only</option>
                        <option value="territory">Territories Only</option>
                        <option value="unit">Units Only</option>
                    </select>
                </div>

                <div>
                    <label for="performanceSelect" class="block text-xs font-bold text-blue-600 uppercase tracking-wider mb-2">3. Performance Filter</label>
                    <select id="performanceSelect" class="w-full bg-blue-50 border border-blue-200 text-blue-900 text-sm font-medium rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 p-2.5 outline-none transition-all cursor-pointer shadow-sm">
                        <option value="all">Show All Selected</option>
                        <option value="above">Above Country Average</option>
                        <option value="below">Below Country Average</option>
                        <option value="critical">Critical (> 5% Below Avg)</option>
                    </select>
                </div>
            </div>

            <!-- Hierarchical Tree Selection -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col h-[600px]">
                <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-2xl">
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider">4. Select Scope (Tree)</label>
                    <button onclick="clearAllChecks()" class="text-xs font-semibold text-blue-600 hover:text-blue-800">Clear</button>
                </div>
                <div class="p-4 overflow-y-auto flex-1 custom-scrollbar" id="treeContainer">
                    <!-- Tree is injected here via JS -->
                </div>
            </div>
        </aside>

        <!-- RIGHT MAIN CONTENT -->
        <main class="flex-1 min-w-0 space-y-6 flex flex-col" id="printable-dashboard">
            
            <!-- KPI Strip -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4" id="kpiContainer">
                <!-- KPIs injected via JS -->
            </div>

            <!-- Chart Card -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 flex-1 flex flex-col">
                <div class="px-6 py-4 border-b border-slate-100 flex flex-wrap gap-4 justify-between items-center bg-slate-50 rounded-t-2xl">
                    <div class="flex items-center gap-3">
                        <h2 id="dynamicChartTitle" class="text-base font-bold text-slate-800 tracking-tight">Trend Comparison</h2>
                        <span id="chartSubtext" class="text-xs font-medium text-slate-500 bg-white px-2 py-1 rounded-md border border-slate-200 shadow-sm"></span>
                    </div>
                    
                    <div class="flex items-center gap-4">
                        <!-- Toggle for Data Table -->
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="tableToggle" class="sr-only peer" onchange="toggleTable()">
                            <div class="w-9 h-5 bg-slate-300 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-blue-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                            <span class="ml-2 text-sm font-semibold text-slate-600">Show Table</span>
                        </label>

                        <!-- Export Menu -->
                        <div class="relative export-menu-container z-10 border-l border-slate-200 pl-4">
                            <button class="flex items-center gap-2 px-3 py-1.5 bg-white hover:bg-slate-100 text-slate-700 text-sm font-semibold rounded-lg transition-colors border border-slate-200 shadow-sm">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                                Export
                            </button>
                            <div class="export-dropdown absolute right-0 mt-2 w-40 bg-white rounded-xl shadow-xl border border-slate-100 py-2">
                                <button onclick="exportCSV()" class="w-full text-left px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 hover:text-blue-600 flex items-center gap-2">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg> CSV Data
                                </button>
                                <button onclick="exportImage()" class="w-full text-left px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 hover:text-blue-600 flex items-center gap-2">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg> Image
                                </button>
                                <button onclick="exportPDF()" class="w-full text-left px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 hover:text-blue-600 flex items-center gap-2">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg> PDF
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="p-6 flex-1 min-h-[400px]">
                    <div class="h-full w-full relative">
                        <canvas id="performanceChart"></canvas>
                    </div>
                </div>

                <!-- Data Table Container (Hidden by default) -->
                <div id="dataTableContainer" class="hidden overflow-x-auto border-t border-slate-100 bg-white max-h-[300px] overflow-y-auto relative rounded-b-2xl">
                    <table class="w-full text-left text-sm text-slate-600 whitespace-nowrap">
                        <thead class="bg-slate-50 text-xs uppercase text-slate-500 sticky top-0 shadow-sm" id="tableHead">
                        </thead>
                        <tbody class="divide-y divide-slate-100" id="tableBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.getElementById('currentDateDisplay').innerText = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

        // --- 1. DATA CONFIGURATION & HIERARCHY GENERATION ---
        const months = ["Jan'26", "Feb'26", "Mar'26", "Apr'26", "May'26", "Jun'26", "Jul'26", "Aug'26", "Sep'26", "Oct'26", "Nov'26", "Dec'26"];

        const benchmarkData = {
            "EMI Progress": [85, 86, 88, 87, 89, 90, 91, 90, 92, 93, 94, 95],
            "Collectable (%)": [70, 72, 75, 74, 76, 78, 80, 79, 81, 82, 84, 85],
            "Collection (%)": [90, 91, 92, 91, 93, 94, 95, 94, 96, 97, 98, 98]
        };

        // Flat dictionary to hold all generated data easily
        const allEntitiesData = {}; 
        
        function generateVarianceData(baseData, variance) {
            return baseData.map(val => Math.min(100, Math.max(0, val + (Math.random() * variance * 2 - variance))));
        }

        // Build Tree Structure and Data simultaneously
        const hierarchyTree = [];
        let rCount = 1, tCount = 1, uCount = 1;
        const zones = ["North Zone", "South Zone", "East Zone", "West Zone"];

        zones.forEach(zName => {
            let zoneNode = { name: zName, type: 'zone', children: [] };
            allEntitiesData[zName] = { 
                "EMI Progress": generateVarianceData(benchmarkData["EMI Progress"], 3),
                "Collectable (%)": generateVarianceData(benchmarkData["Collectable (%)"], 4),
                "Collection (%)": generateVarianceData(benchmarkData["Collection (%)"], 2)
            };

            for(let r=1; r<=3; r++) { // 3 Regions per Zone
                let rName = `Region ${String(rCount).padStart(2, '0')}`;
                let regionNode = { name: rName, type: 'region', children: [] };
                allEntitiesData[rName] = { 
                    "EMI Progress": generateVarianceData(benchmarkData["EMI Progress"], 6),
                    "Collectable (%)": generateVarianceData(benchmarkData["Collectable (%)"], 8),
                    "Collection (%)": generateVarianceData(benchmarkData["Collection (%)"], 5)
                };
                
                let terrPerRegion = (rCount % 2 === 0) ? 4 : 3; // 3-4 Territories per Region
                for(let t=1; t<=terrPerRegion; t++) {
                    let tName = `Territory ${String(tCount).padStart(2, '0')}`;
                    let terrNode = { name: tName, type: 'territory', children: [] };
                    allEntitiesData[tName] = { 
                        "EMI Progress": generateVarianceData(benchmarkData["EMI Progress"], 10),
                        "Collectable (%)": generateVarianceData(benchmarkData["Collectable (%)"], 12),
                        "Collection (%)": generateVarianceData(benchmarkData["Collection (%)"], 8)
                    };

                    for(let u=1; u<=3; u++) { // 3 Units per Territory
                        let uName = `Unit ${String(uCount).padStart(3, '0')}`;
                        terrNode.children.push({ name: uName, type: 'unit', children: [] });
                        allEntitiesData[uName] = { 
                            "EMI Progress": generateVarianceData(benchmarkData["EMI Progress"], 15),
                            "Collectable (%)": generateVarianceData(benchmarkData["Collectable (%)"], 20),
                            "Collection (%)": generateVarianceData(benchmarkData["Collection (%)"], 12)
                        };
                        uCount++;
                    }
                    regionNode.children.push(terrNode);
                    tCount++;
                }
                zoneNode.children.push(regionNode);
                rCount++;
            }
            hierarchyTree.push(zoneNode);
        });

        // 20 distinct colors for plotting
        const standardColors = [
            '#2563eb', '#059669', '#d97706', '#7c3aed', '#0891b2', '#db2777', '#ea580c', '#4f46e5', '#16a34a', '#dc2626',
            '#8b5cf6', '#0ea5e9', '#10b981', '#f59e0b', '#f43f5e', '#3b82f6', '#84cc16', '#06b6d4', '#ec4899', '#f97316'
        ];
        let myChart = null;

        // --- 2. BUILD TREE UI ---
        function renderTreeHTML(nodes, isRoot = true) {
            // FIX: Removed 'tree-children' from the ul class string so it isn't hidden twice
            let html = `<ul class="${isRoot ? '' : 'pl-5 border-l border-slate-200 ml-2 mt-1 space-y-1'}">`;
            nodes.forEach(node => {
                const hasChildren = node.children && node.children.length > 0;
                const targetId = node.name.replace(/\s+/g, '-');
                html += `
                    <li class="relative mt-1">
                        <div class="flex items-center gap-2 py-1 px-1 rounded hover:bg-slate-100 transition-colors group">
                            ${hasChildren ? `
                                <button type="button" class="tree-toggle flex-shrink-0 w-5 h-5 flex items-center justify-center text-slate-400 hover:text-blue-600 transition-colors" data-target="${targetId}">
                                    <svg class="chevron w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                                </button>
                            ` : `<div class="w-5 h-5 flex-shrink-0"></div>`}
                            <input type="checkbox" data-level="${node.type}" class="entity-checkbox w-4 h-4 text-blue-600 bg-slate-100 border-slate-300 rounded focus:ring-blue-500 cursor-pointer" value="${node.name}">
                            <span class="text-sm font-medium ${isRoot ? 'text-slate-800' : 'text-slate-600'} cursor-pointer select-none" onclick="this.previousElementSibling.click()">${node.name}</span>
                        </div>
                        ${hasChildren ? `<div id="${targetId}" class="tree-children">${renderTreeHTML(node.children, false)}</div>` : ''}
                    </li>
                `;
            });
            html += '</ul>';
            return html;
        }

        document.getElementById('treeContainer').innerHTML = renderTreeHTML(hierarchyTree);

        // Robust Event Delegation for Tree Toggle
        document.getElementById('treeContainer').addEventListener('click', (e) => {
            const toggleBtn = e.target.closest('.tree-toggle');
            if (toggleBtn) {
                const targetId = toggleBtn.getAttribute('data-target');
                const targetEl = document.getElementById(targetId);
                const chevron = toggleBtn.querySelector('.chevron');
                if(targetEl) {
                    targetEl.classList.toggle('open');
                    chevron.classList.toggle('open');
                }
            }
        });

        // Robust Event Delegation for Checkbox Cascade Logic
        document.getElementById('treeContainer').addEventListener('change', (e) => {
            if (e.target.classList.contains('entity-checkbox')) {
                const cb = e.target;
                const li = cb.closest('li');
                
                // 1. Cascade down to children
                const childCbs = li.querySelectorAll('.tree-children .entity-checkbox');
                childCbs.forEach(childCb => {
                    childCb.checked = cb.checked;
                    childCb.indeterminate = false;
                });
                
                // 2. Cascade up to parents
                let currentLi = li.parentElement.closest('li');
                while (currentLi) {
                    const parentCb = currentLi.querySelector('.entity-checkbox'); // Gets parent's own checkbox
                    const treeChildren = currentLi.querySelector('.tree-children');
                    
                    if (treeChildren) {
                        const childLis = treeChildren.querySelector('ul').children;
                        const siblingCbs = Array.from(childLis).map(child => child.querySelector('.entity-checkbox'));
                        
                        const allChecked = siblingCbs.length > 0 && siblingCbs.every(c => c.checked);
                        const someChecked = siblingCbs.some(c => c.checked || c.indeterminate);
                        
                        if (allChecked) {
                            parentCb.checked = true;
                            parentCb.indeterminate = false;
                        } else if (someChecked) {
                            parentCb.checked = false;
                            parentCb.indeterminate = true;
                        } else {
                            parentCb.checked = false;
                            parentCb.indeterminate = false;
                        }
                    }
                    currentLi = currentLi.parentElement.closest('li');
                }
                
                // 3. Update dashboard
                updateDashboard();
            }
        });

        // Initial setup for Tree - check North Zone and cascade down
        const initialCheck = document.querySelector('.entity-checkbox[value="North Zone"]');
        if(initialCheck) {
            initialCheck.checked = true;
            initialCheck.closest('li').querySelectorAll('.tree-children .entity-checkbox').forEach(cb => cb.checked = true);
        }

        function clearAllChecks() {
            document.querySelectorAll('.entity-checkbox').forEach(cb => {
                cb.checked = false;
                cb.indeterminate = false;
            });
            updateDashboard();
        }

        // Ensure Chart Background is Solid White for Exports
        Chart.register({
            id: 'customCanvasBackgroundColor',
            beforeDraw: (chart, args, options) => {
                const {ctx} = chart; ctx.save(); ctx.globalCompositeOperation = 'destination-over';
                ctx.fillStyle = options.color || '#ffffff'; ctx.fillRect(0, 0, chart.width, chart.height); ctx.restore();
            }
        });

        // --- 3. CORE LOGIC: FILTER & RENDER ---
        function getActiveEntities() {
            const metric = document.getElementById('metricSelect').value;
            const perfFilter = document.getElementById('performanceSelect').value;
            const displayLevel = document.getElementById('displayLevelSelect').value;
            const currentMonthIdx = months.length - 1;
            const currentAvg = benchmarkData[metric][currentMonthIdx];

            // Only extract checked boxes that match the strictly selected Plot Level (prevents mixing)
            const checkedBoxes = Array.from(document.querySelectorAll(`.entity-checkbox[data-level="${displayLevel}"]:checked`)).map(cb => cb.value);
            let filteredEntities = {};

            checkedBoxes.forEach(name => {
                const data = allEntitiesData[name];
                const val = data[metric][currentMonthIdx];
                let keep = false;

                if (perfFilter === 'all') keep = true;
                else if (perfFilter === 'above' && val >= currentAvg) keep = true;
                else if (perfFilter === 'below' && val < currentAvg) keep = true;
                else if (perfFilter === 'critical' && val <= currentAvg - 5) keep = true;

                if (keep) filteredEntities[name] = data;
            });

            return filteredEntities;
        }

        function updateDashboard() {
            const metric = document.getElementById('metricSelect').value;
            const activeEntities = getActiveEntities();
            const displayLevel = document.getElementById('displayLevelSelect').value;
            
            // Subtext logic dynamically adjusts to isolated Plot Level
            const count = Object.keys(activeEntities).length;
            const checkedCount = document.querySelectorAll(`.entity-checkbox[data-level="${displayLevel}"]:checked`).length;
            let subText = `Displaying ${count} Entit${count === 1 ? 'y' : 'ies'}`;
            if(checkedCount > count) subText += ` (Filtered from ${checkedCount})`;
            document.getElementById('chartSubtext').innerText = subText;

            renderKPIs(metric, activeEntities);
            renderChart(metric, activeEntities);
            renderTable(metric, activeEntities);
        }

        function renderKPIs(metric, activeEntities) {
            const currentMonthIdx = months.length - 1; 
            const currentAvg = benchmarkData[metric][currentMonthIdx];
            const kpiContainer = document.getElementById('kpiContainer');
            
            let html = '';
            const iconWrap = (color, svg) => `<div class="p-3 bg-${color}-50 rounded-xl"><svg class="w-6 h-6 text-${color}-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">${svg}</svg></div>`;
            
            // KPI 1: Benchmark
            html += `
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between hover:shadow-md transition-shadow">
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Country Average</h3>
                            <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-bold bg-slate-100 text-slate-600">${months[currentMonthIdx]}</span>
                        </div>
                        ${iconWrap('indigo', '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"></path>')}
                    </div>
                    <div class="mt-4 flex items-baseline text-3xl font-extrabold text-slate-900">${currentAvg.toFixed(1)}%</div>
                </div>
            `;

            let count = Object.keys(activeEntities).length;
            if (count === 0) {
                html += `<div class="col-span-3 bg-slate-50 p-6 rounded-2xl border border-slate-200 flex items-center justify-center text-slate-500 font-medium text-sm">Please select entities from the tree to view KPIs.</div>`;
            } else if (count === 1) {
                // Specific Mode KPIs
                const name = Object.keys(activeEntities)[0];
                const val = activeEntities[name][metric][currentMonthIdx];
                const variance = val - currentAvg;
                const isPos = variance >= 0;
                html += `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between hover:shadow-md transition-shadow">
                        <div class="flex justify-between items-start">
                            <div><h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 truncate" title="${name}">${name}</h3>
                            <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-bold bg-slate-100 text-slate-600">Current</span></div>
                            ${iconWrap('blue', '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>')}
                        </div>
                        <div class="mt-4 flex items-baseline text-3xl font-extrabold text-slate-900">${val.toFixed(1)}%</div>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between hover:shadow-md transition-shadow">
                        <div class="flex justify-between items-start">
                            <div><h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Gap vs Average</h3>
                            <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-bold bg-slate-100 text-slate-600">Variance</span></div>
                            ${iconWrap(isPos ? 'emerald' : 'rose', isPos ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path>' : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>')}
                        </div>
                        <div class="mt-4 flex items-baseline text-3xl font-extrabold ${isPos ? 'text-emerald-600' : 'text-rose-600'}">${isPos ? '+' : ''}${variance.toFixed(1)}%</div>
                    </div>
                    <div class="bg-slate-50 rounded-2xl border border-slate-100"></div>
                `;
            } else {
                // Aggregate Mode KPIs
                let bestNames = [], bestVal = -Infinity;
                let worstNames = [], worstVal = Infinity;
                let criticalCount = 0;
                
                for (const [name, data] of Object.entries(activeEntities)) {
                    const val = data[metric][currentMonthIdx];
                    if (val > bestVal) { bestVal = val; bestNames = [name]; } else if (val === bestVal) { bestNames.push(name); }
                    if (val < worstVal) { worstVal = val; worstNames = [name]; } else if (val === worstVal) { worstNames.push(name); }
                    if (val <= currentAvg - 5) criticalCount++;
                }

                html += `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between hover:shadow-md transition-shadow">
                        <div class="flex justify-between items-start">
                            <div class="pr-2"><h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Top Performer(s)</h3>
                            <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-bold bg-slate-100 text-slate-600 truncate max-w-[100px]" title="${bestNames.join(', ')}">${bestNames.join(', ')}</span></div>
                            ${iconWrap('emerald', '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path>')}
                        </div>
                        <div class="mt-4 flex items-baseline text-3xl font-extrabold text-slate-900">${bestVal.toFixed(1)}%</div>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between hover:shadow-md transition-shadow">
                        <div class="flex justify-between items-start">
                            <div class="pr-2"><h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Action Required</h3>
                            <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-bold bg-slate-100 text-slate-600 truncate max-w-[100px]" title="${worstNames.join(', ')}">${worstNames.join(', ')}</span></div>
                            ${iconWrap('rose', '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>')}
                        </div>
                        <div class="mt-4 flex items-baseline text-3xl font-extrabold text-slate-900">${worstVal.toFixed(1)}%</div>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between hover:shadow-md transition-shadow">
                        <div class="flex justify-between items-start">
                            <div><h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Critical Entities</h3>
                            <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-bold bg-slate-100 text-slate-600">> 5% Below Avg</span></div>
                            ${iconWrap('amber', '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>')}
                        </div>
                        <div class="mt-4 flex items-baseline text-3xl font-extrabold ${criticalCount > 0 ? 'text-amber-600' : 'text-emerald-600'}">${criticalCount} <span class="text-sm font-bold text-slate-400 ml-1">/ ${count}</span></div>
                    </div>
                `;
            }
            kpiContainer.innerHTML = html;
        }

        function renderChart(metric, activeEntities) {
            const ctx = document.getElementById('performanceChart').getContext('2d');
            if (myChart) myChart.destroy();
            
            const entityCount = Object.keys(activeEntities).length;
            if(entityCount === 0) return; // Draw nothing

            const datasets = [];
            let globalMin = Math.min(...benchmarkData[metric]);
            
            // BI STRATEGY: High Density vs Standard rendering
            const isHighDensity = entityCount > 10;

            // 1. Benchmark Layer
            datasets.push({
                label: 'Country Average', data: benchmarkData[metric],
                borderColor: '#dc2626', backgroundColor: 'transparent',
                borderWidth: isHighDensity ? 4 : 3, borderDash: [8, 6], 
                pointRadius: isHighDensity ? 0 : 4, pointHoverRadius: 8, pointBackgroundColor: '#dc2626',
                tension: 0.3, order: 1
            });

            // 2. Entity Layers
            let colorIndex = 0;
            for (const [name, data] of Object.entries(activeEntities)) {
                const mData = data[metric];
                globalMin = Math.min(globalMin, ...mData);
                const baseColor = standardColors[colorIndex % standardColors.length];
                // Add transparency if high density
                const lineColor = isHighDensity ? baseColor + '99' : baseColor;
                
                datasets.push({
                    label: name, data: mData,
                    borderColor: lineColor, backgroundColor: 'transparent',
                    borderWidth: isHighDensity ? 1.5 : 2.5, pointRadius: isHighDensity ? 0 : 3, 
                    hoverBorderWidth: 4, hoverBorderColor: baseColor, pointHoverRadius: 6,
                    tension: 0.3, order: 2
                });
                colorIndex++;
            }

            const calculatedMin = Math.max(0, Math.floor(globalMin / 10) * 10 - 5);
            Chart.defaults.font.family = "'Inter', sans-serif";
            Chart.defaults.color = '#64748b';

            myChart = new Chart(ctx, {
                type: 'line',
                data: { labels: months, datasets: datasets },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    interaction: { mode: isHighDensity ? 'nearest' : 'index', intersect: isHighDensity ? true : false, axis: 'xy' },
                    plugins: {
                        legend: { display: !isHighDensity, position: 'top', align: 'end', labels: { padding: 20, font: { size: 12, weight: '600' }, usePointStyle: true, boxWidth: 8 } },
                        tooltip: { backgroundColor: 'rgba(15, 23, 42, 0.95)', titleColor: '#fff', bodyColor: '#fff', padding: 12, cornerRadius: 8, callbacks: { label: (c) => ` ${c.dataset.label}: ${c.parsed.y.toFixed(1)}%` } },
                        customCanvasBackgroundColor: { color: 'white' }
                    },
                    scales: {
                        y: { min: calculatedMin, grid: { color: '#f1f5f9', drawBorder: false }, ticks: { callback: (val) => val + '%', font: { size: 11, weight: '500' } } },
                        x: { grid: { display: false }, ticks: { font: { size: 11, weight: '500' } } }
                    }
                }
            });
        }

        function toggleTable() {
            const container = document.getElementById('dataTableContainer');
            const toggle = document.getElementById('tableToggle');
            container.classList.toggle('hidden', !toggle.checked);
        }

        function renderTable(metric, activeEntities) {
            const tHead = document.getElementById('tableHead');
            const tBody = document.getElementById('tableBody');
            
            if(Object.keys(activeEntities).length === 0) { tHead.innerHTML=''; tBody.innerHTML=''; return; }

            let headHTML = `<tr><th class="px-6 py-4 font-bold text-slate-700 bg-slate-50 border-b border-slate-200">Entity Name</th>`;
            months.forEach(m => headHTML += `<th class="px-6 py-4 font-bold text-slate-700 bg-slate-50 border-b border-slate-200">${m}</th>`);
            headHTML += `</tr>`;
            tHead.innerHTML = headHTML;
            
            let bodyHTML = `<tr class="bg-blue-50/40"><td class="px-6 py-3 font-bold text-slate-800 border-b border-blue-100">Country Average</td>`;
            benchmarkData[metric].forEach(val => bodyHTML += `<td class="px-6 py-3 font-bold text-blue-600 border-b border-blue-100">${val.toFixed(1)}%</td>`);
            bodyHTML += `</tr>`;
            
            for (const [name, data] of Object.entries(activeEntities)) {
                bodyHTML += `<tr class="hover:bg-slate-50 transition-colors"><td class="px-6 py-3 font-semibold text-slate-700 border-b border-slate-100">${name}</td>`;
                data[metric].forEach(val => bodyHTML += `<td class="px-6 py-3 text-slate-600 border-b border-slate-100">${val.toFixed(1)}%</td>`);
                bodyHTML += `</tr>`;
            }
            tBody.innerHTML = bodyHTML;
        }

        // --- 4. EXPORT FUNCTIONS ---
        function exportCSV() {
            const metric = document.getElementById('metricSelect').value;
            const activeEntities = getActiveEntities();
            if(Object.keys(activeEntities).length === 0) return alert('No data to export.');
            
            let csv = "Entity," + months.join(",") + "\n";
            csv += "Country Average," + benchmarkData[metric].map(n => n.toFixed(2)).join(",") + "\n";
            for(const [name, data] of Object.entries(activeEntities)) {
                csv += `"${name}",${data[metric].map(n => n.toFixed(2)).join(",")}\n`;
            }
            
            const encodedUri = encodeURI("data:text/csv;charset=utf-8," + csv);
            const link = document.createElement("a");
            link.href = encodedUri;
            link.download = `Data_Export_${metric.replace(/ /g,'_')}.csv`;
            document.body.appendChild(link);
            link.click(); document.body.removeChild(link);
        }

        function exportImage() {
            if(!myChart) return;
            const link = document.createElement('a');
            link.download = 'Chart_Export.png';
            link.href = document.getElementById('performanceChart').toDataURL('image/png', 1.0); 
            link.click();
        }

        function exportPDF() {
            const element = document.getElementById('printable-dashboard');
            const opt = {
                margin:       0.3, filename: 'Dashboard_Report.pdf', image: { type: 'jpeg', quality: 1.0 },
                html2canvas:  { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
                jsPDF:        { unit: 'in', format: 'letter', orientation: 'landscape' }
            };
            const originalBg = element.style.backgroundColor;
            element.style.backgroundColor = '#ffffff'; 
            html2pdf().set(opt).from(element).save().then(() => element.style.backgroundColor = originalBg);
        }

        // --- 5. BIND LISTENERS ---
        document.getElementById('metricSelect').addEventListener('change', updateDashboard);
        document.getElementById('displayLevelSelect').addEventListener('change', updateDashboard);
        document.getElementById('performanceSelect').addEventListener('change', updateDashboard);
        
        // Initial setup
        updateDashboard();
    </script>
</body>
</html>
